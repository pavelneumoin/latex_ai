<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Кнопки, бейджи, сегменты</title>
<style>
:root{--bg:#FDFCFA;--surface:#F7F5F0;--surface-2:#EFECE4;--border:#E7E3D9;--border-2:#D5CFC1;--fg:#1C1917;--fg-2:#57534E;--fg-3:#837E76;--primary:#4F46E5;--primary-soft:#E7E5FB;--accent:#F59E0B;--accent-strong:#DE8F05}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:28px}
h2{font-family:Manrope,sans-serif;font-size:15px;margin:22px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:10px 16px;min-height:40px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--accent);color:#1C1917;box-shadow:0 1px 2px rgba(28,25,23,.05)}
.btn-primary:hover{background:var(--accent-strong)}
.btn-blue{background:var(--primary);color:#fff}
.btn-outline{background:#fff;border-color:var(--border-2);color:var(--fg)}
.btn-ghost{background:transparent;color:var(--fg-2)}
.btn-lg{padding:14px 22px;min-height:48px;font-size:15px}
.tier{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700}
.tier.basic{background:var(--surface-2);color:var(--fg-2)}
.tier.source{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E}
.tier.free{background:#D1FAE5;color:#065F46}
.mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;font-family:Manrope,sans-serif;font-weight:800;font-size:15px}
.m5{background:#D1FAE5;color:#065F46}.m4{background:#ECFDF5;color:#047857}.m3{background:#FEF3C7;color:#92400E}.m2{background:#FEE2E2;color:#991B1B}.mn{background:var(--surface-2);color:var(--fg-3)}
.seg{display:inline-flex;padding:4px;background:var(--surface-2);border-radius:12px;gap:2px}
.seg button{padding:8px 16px;font-size:13.5px;font-weight:600;border-radius:9px;border:none;background:transparent;color:var(--fg-2);cursor:pointer}
.seg .on{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(28,25,23,.08)}
</style></head><body>
<h2>Кнопки</h2>
<div class="row"><a class="btn btn-primary btn-lg">Смотреть каталог</a><a class="btn btn-primary">Купить за 49 ₽</a><a class="btn btn-blue">Подключить</a><a class="btn btn-outline">Скачать</a><a class="btn btn-ghost">Отмена</a></div>
<h2>Уровни материалов</h2>
<div class="row"><span class="tier basic">PDF</span><span class="tier source">PDF + исходники</span><span class="tier free">Бесплатно</span></div>
<h2>Отметки (проверка работ)</h2>
<div class="row"><span class="mark m5">5</span><span class="mark m4">4</span><span class="mark m3">3</span><span class="mark m2">2</span><span class="mark mn">н</span></div>
<h2>Сегментный переключатель</h2>
<div class="seg"><button class="on">Помесячно</button><button>На год <b style="color:#10B981">−25%</b></button></div>
</body></html>
